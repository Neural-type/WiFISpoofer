name: Build WiFi Spoofer APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || echo "gradlew not found, will generate"
      
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 || true
      
    - name: Make gradlew executable again
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wifi-spoofer-v11.0-apk
        path: app/build/outputs/apk/debug/*.apk
        
    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v11.0-build-${{ github.run_number }}
        name: WiFi Spoofer v11.0 GPS Architecture - Build ${{ github.run_number }}
        body: |
          ## WiFi Spoofer v11.0 - GPS Architecture
          
          **Complete Rewrite - 99% Reliability!**
          
          ### Features:
          - Bulletproof dual-level hooks
          - System Server + Application hooks
          - 99% reliability
          - Android 12+ support
          
          ### Installation:
          1. Download APK below
          2. Install APK
          3. Enable in LSPosed (scope: android only)
          4. Reboot
          5. Done!
          
          Based on GPS Setter: https://github.com/jqssun/android-gps-setter
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}